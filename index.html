<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 주문서</title>
  <!-- 스타일과 주문 기능은 별도 파일에서 추가합니다. -->
  <link rel="stylesheet" href="style.css">
  <!-- Supabase v2를 먼저 불러옵니다. defer 스크립트는 적힌 순서대로 실행됩니다. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <!-- 카페 로고와 소개 -->
  <header>
    <h1><span aria-hidden="true">☕</span><br>바이브 카페</h1>
    <p>당신의 하루에 바이브를 더하다</p>
    <!-- 탭 버튼과 해당 화면을 aria-controls로 연결합니다. -->
    <div class="tabs" role="tablist" aria-label="카페 메뉴">
      <button type="button" id="order-tab" class="tab-button" role="tab" aria-selected="true" aria-controls="order-panel">☕ 주문하기</button>
      <button type="button" id="history-tab" class="tab-button" role="tab" aria-selected="false" aria-controls="history-panel" tabindex="-1">📋 주문 내역 <span id="order-count" class="order-badge">0</span></button>
    </div>
  </header>

  <main>
    <section id="order-panel" role="tabpanel" aria-labelledby="order-tab">
    <h2>주문서</h2>
    <!-- 이름의 필수 입력 검사는 추후 JavaScript에서 처리합니다. -->
    <form id="order-form" novalidate>
      <div>
        <label for="customer-name">이름 (필수)</label>
        <input type="text" id="customer-name" name="customerName" autocomplete="name" required>
      </div>

      <div>
        <label for="customer-phone">전화번호</label>
        <input type="tel" id="customer-phone" name="customerPhone" autocomplete="tel">
      </div>

      <!-- 가격은 JavaScript에서 읽을 수 있도록 숫자로 저장합니다. -->
      <div>
        <label for="drink">음료 선택</label>
        <select id="drink" name="drink">
          <option value="" data-price="0">-- 음료를 선택하세요 --</option>
          <option value="americano" data-price="3500">아메리카노 3,500원</option>
          <option value="iced-tea-with-shot" data-price="3800">아샷추 3,800원</option>
          <option value="cafe-latte" data-price="4000">카페라떼 4,000원</option>
          <option value="cafe-mocha" data-price="4500">카페모카 4,500원</option>
          <option value="vanilla-latte" data-price="4500">바닐라라떼 4,500원</option>
          <option value="green-tea-latte" data-price="4500">녹차라떼 4,500원</option>
          <option value="strawberry-yogurt-smoothie" data-price="5000">딸기 요거트 스무디 5,000원</option>
          <option value="watermelon-juice" data-price="5000">땡모반 수박 주스 5,000원</option>
        </select>
      </div>

      <!-- 사이즈는 한 가지만 선택하며 M을 기본으로 표시합니다. -->
      <fieldset>
        <legend>사이즈</legend>
        <input type="radio" id="size-s" name="size" value="S" data-price="0">
        <label for="size-s">S +0원</label>
        <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
        <label for="size-m">M +500원</label>
        <input type="radio" id="size-l" name="size" value="L" data-price="1000">
        <label for="size-l">L +1,000원</label>
      </fieldset>

      <!-- 추가 옵션은 여러 개를 선택할 수 있습니다. -->
      <fieldset>
        <legend>추가 옵션</legend>
        <input type="checkbox" id="option-shot" name="options" value="shot" data-price="500">
        <label for="option-shot">샷 추가 +500원</label>
        <input type="checkbox" id="option-cream" name="options" value="cream" data-price="500">
        <label for="option-cream">크림 추가 +500원</label>
        <input type="checkbox" id="option-syrup" name="options" value="syrup" data-price="300">
        <label for="option-syrup">시럽 추가 +300원</label>
        <input type="checkbox" id="option-decaf" name="options" value="decaf" data-price="0">
        <label for="option-decaf">디카페인 +0원</label>
      </fieldset>

      <div>
        <label for="quantity">수량</label>
        <input type="number" id="quantity" name="quantity" min="1" max="15" value="1">
      </div>

      <div>
        <label for="requests">요청사항</label>
        <textarea id="requests" name="requests" rows="4"></textarea>
      </div>

      <!-- 예상 금액은 주문하기 버튼 바로 위에 표시합니다. -->
      <p id="estimated-total" aria-live="polite">예상 금액: 0원</p>
      <button type="submit">주문하기</button>
      <button type="reset">다시 작성</button>

      <!-- 주문 확인 메시지는 처음에는 숨겨 둡니다. -->
      <div id="order-confirmation" class="hidden" role="status"></div>
    </form>
    </section>

    <!-- 주문 내역은 처음에 숨기고 탭을 선택하면 표시합니다. -->
    <section id="history-panel" class="hidden" role="tabpanel" aria-labelledby="history-tab">
      <h2>주문 내역</h2>
      <p id="empty-orders">아직 주문 내역이 없어요 ☕</p>
      <ul id="orders-list" aria-label="접수된 주문 목록"></ul>
      <p id="orders-total" role="status">총 주문 금액: 0원 (0건)</p>
      <button type="button" id="clear-orders" class="secondary-button" disabled>내역 모두 지우기</button>
    </section>
  </main>
</body>
</html>
